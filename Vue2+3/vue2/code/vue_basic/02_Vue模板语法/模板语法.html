<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>模板语法</title>
    <!-- 引入Vue -->
    <script type="text/javascript" src="../js/vue.js"></script>
</head>
<body>
    <!-- 准备容器 -->
    <div id="root">
        <h1>插值语法</h1>
        <h3>你好，{{name}}</h3>
        <hr/>

        <h1>指令语法</h1>
        <a v-bind:href="school.url">点我去{{school.name}}（正常）</a>
        <a :href="school.url">点我去{{school.name}}（简写）</a>
    </div>

    <script type="text/javascript">
        Vue.config.productionTip = false
    
        // 创建Vue实例
        new Vue({
            el: '#root',
            data: {
                name: 'jack',
                school: {
                    name: '尚硅谷',
                    url: "http://www.atguigu.com"
                }
            }
        })
    </script>

    <script type="text/javascript">
        setTimeout(function() {
            if (window.__VUE_DEVTOOLS_GLOBAL_HOOK__) {
                window.__VUE_DEVTOOLS_GLOBAL_HOOK__.emit('init', Vue);
            }
        }, 100);
    </script>
</body>
</html>
